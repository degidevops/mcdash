<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<title>TPO Context</title>
<style>
:root{
  --bg:#070b10;--bg2:#0b1119;--pn:#0e151e;--bd:#1c2733;--bd2:#2a3a4b;
  --tx:#d7e0ea;--mu:#7d8ea1;--dim:#4d5b6b;
  --up:#26d07c;--dn:#ff4d5e;--am:#ffb020;--ac:#4db2ff;
  --W:#b392f0;--D:#58a6ff;--S:#f0883e;--M:#39c5bb;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:12.5px/1.5 var(--mono);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}.in{color:var(--ac)}
b{font-weight:700}small{font-size:.88em}

/* ---------- tombol & input */
button{background:var(--pn);color:var(--tx);border:1px solid var(--bd2);border-radius:3px;padding:5px 11px;cursor:pointer;
  font:600 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;min-height:30px}
button:hover{border-color:var(--ac);color:var(--ac)}
button.pri{border-color:var(--up);color:var(--up)}button.pri:hover{background:#0f2a1e}
button:disabled{opacity:.5;cursor:default}
select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd2);border-radius:3px;font:12px var(--mono)}
select{padding:5px 8px;min-height:30px}
textarea{width:100%;height:46vh;padding:8px;line-height:1.4}

/* ---------- header: ticker + tab */
.hd{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd2)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding:8px 14px}
.brand{font-weight:800;letter-spacing:.18em;color:var(--am);font-size:13px}.brand i{font-style:normal;color:var(--dim)}
.tick{display:flex;align-items:baseline;gap:10px}
#sym{color:var(--mu);font-weight:700}
#px{font-size:24px;font-weight:800;line-height:1;padding:1px 6px;border-radius:3px}
#px.fu{animation:fu .7s ease-out}#px.fd{animation:fd .7s ease-out}
@keyframes fu{from{background:#103a28;color:var(--up)}to{background:transparent}}
@keyframes fd{from{background:#42151b;color:var(--dn)}to{background:transparent}}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--mu);font-size:11.5px}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
#dot{width:8px;height:8px;border-radius:50%;background:var(--dn);box-shadow:0 0 6px var(--dn)}
#dot.ok{background:var(--up);box-shadow:0 0 6px var(--up)}
#st{color:var(--mu);font-size:11px;max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner{display:none;margin:10px 14px 0;padding:8px 12px;border-radius:3px;background:#2a1216;border:1px solid var(--dn);color:#ffb3ba}

/* ---------- panel */
.panel,.card{background:var(--pn);border:1px solid var(--bd);border-radius:4px}
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--bg2);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);border-radius:4px 4px 0 0}
.ph>b{color:var(--am);letter-spacing:.14em}.ph .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.ph small{text-transform:none;letter-spacing:0}
.tg{font-style:normal;font-size:10.5px;font-weight:800;padding:0 5px;border-radius:2px;color:#06090d;margin-right:6px}
.tg.W{background:var(--W)}.tg.D{background:var(--D)}.tg.S{background:var(--S)}.tg.M{background:var(--M)}

/* ---------- chip / badge */
.chip{display:inline-block;padding:0 8px;border-radius:2px;border:1px solid var(--bd2);white-space:nowrap;font-size:11.5px}
.chip.up{border-color:var(--up);color:var(--up)}.chip.dn{border-color:var(--dn);color:var(--dn)}
.chip.in{border-color:var(--ac);color:var(--ac)}.chip.am{border-color:var(--am);color:var(--am)}
.vd{font-weight:800;padding:1px 10px;border-radius:2px;border:1px solid var(--bd2);letter-spacing:.02em}
.vd.up{border-color:var(--up);color:var(--up);background:#0c2218}.vd.dn{border-color:var(--dn);color:var(--dn);background:#2a1014}
.vd.am{border-color:var(--am);color:var(--am);background:#2a1f08}.vd.in{border-color:var(--ac);color:var(--ac);background:#0b1e30}
.vd.mu{color:var(--mu)}
.eb{display:inline-block;min-width:44px;text-align:center;font-weight:800;font-size:10.5px;letter-spacing:.06em;padding:0 5px;border-radius:2px;color:#06090d;margin-right:6px}
.eb.up{background:var(--up)}.eb.dn{background:var(--dn)}.eb.in{background:var(--ac)}

/* ---------- bias */
.page{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.vrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--bd);border-bottom:1px solid var(--bd)}
.vcell{background:var(--pn);padding:8px 10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.vl{font-size:10.5px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
.vl small{letter-spacing:0;text-transform:none;color:var(--dim)}
.bm{display:flex;flex-direction:column}
.br{display:grid;grid-template-columns:minmax(190px,.9fr) minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1.1fr);gap:6px 14px;padding:10px 12px;
  border-left:3px solid var(--bd2);border-bottom:1px solid var(--bd)}
.br:last-child{border-bottom:0}.br.up{border-left-color:var(--up)}.br.dn{border-left-color:var(--dn)}.br.in{border-left-color:var(--ac)}
.bn b.lb{margin-left:6px;letter-spacing:.06em}
.k{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase;margin-bottom:2px}
.k small{letter-spacing:0;text-transform:none;color:var(--dim);margin-left:4px}
.bo{line-height:1.4}

/* ---------- grid utama */
.bn,.bo{grid-column:1/-1}
.card{container-type:inline-size}
@container (max-width:400px){[data-c3]{display:none}}
@container (min-width:620px){.facts{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}.f-mig{grid-column:1/-1}}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(390px,100%),1fr));align-content:start}
.card{border-top:2px solid var(--bd2)}
.card.W{border-top-color:var(--W)}.card.D{border-top-color:var(--D)}.card.S{border-top-color:var(--S)}.card.M{border-top-color:var(--M)}
.card .ph.clk{cursor:pointer}.card .ph.clk:hover{background:#101a26}
.card .bd{padding:6px 10px 10px}
.facts>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px dashed var(--bd)}
.facts span{color:var(--mu)}.facts>div>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.facts .chip{flex:none}.facts>.f-mig>span:first-child{flex:none;overflow:visible}.f-mig>span:last-child{text-align:right}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{padding:3px 7px;text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--mu);border-bottom:1px solid var(--bd2);font-size:11px}
th small{display:block;font-weight:400;font-size:10.5px;color:var(--dim)}
td:first-child,th:first-child{text-align:left;color:var(--mu)}
td.nk{color:var(--am);font-weight:700}td.tc{color:var(--dim);text-decoration:line-through}

aside.panel{align-self:start}
@media(min-width:1050px){aside.panel{position:sticky;top:64px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}}
.lh{padding:6px 10px;color:var(--mu);font-size:11px;border-bottom:1px solid var(--bd)}
.ladwrap{overflow-y:auto;max-height:70vh;scrollbar-width:thin;overscroll-behavior:contain;min-height:0;flex:1}
@media(min-width:1050px){.ladwrap{max-height:none}}
.ladwrap table{margin-top:0}
.lad th{position:sticky;top:0;background:var(--pn);z-index:1}
.lad th:nth-child(2){text-align:left}.lad td{padding:3px 8px}.lad td:nth-child(2){text-align:left;color:var(--tx)}.lad td:first-child{color:var(--tx)}
.lad tr.cf td{border-top:1px dashed var(--am)}.lad tr.px td{background:#0f2236;color:var(--ac);font-weight:800;text-align:center;letter-spacing:.04em}
.lad .nkr td:nth-child(2){color:var(--am)}.lad .dev td:nth-child(2){font-style:italic}
label.ck{display:inline-flex;align-items:center;gap:5px;color:var(--mu);text-transform:none;letter-spacing:0;cursor:pointer}

/* ---------- dialog */
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--bd2);border-radius:6px;width:min(720px,94vw);padding:14px;font:inherit}
dialog::backdrop{background:#000b}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.dh b{color:var(--am);letter-spacing:.14em}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#err,#tgmsg{min-height:1.4em;color:var(--dn)}#tgmsg.ok{color:var(--up)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:6px 0 10px}.kv span:nth-child(odd){color:var(--mu)}

/* histori */
#hdlg{width:min(1180px,97vw);max-height:92vh;overflow:hidden}#hdlg[open]{display:flex;flex-direction:column}
#hbody,#hdata{display:flex;flex-direction:column;min-height:0;flex:1}
.hh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}.hh .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex:1 1 100%;flex-wrap:wrap}.tabs button.on{border-color:var(--ac);color:var(--ac)}.tabs .x{margin-left:auto}
.hnote{margin:6px 0;font-size:11.5px}.warn{margin:6px 0;padding:6px 10px;border:1px solid var(--am);border-radius:3px;color:var(--am)}
.sums{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:6px 0}
.sb{border:1px solid var(--bd);border-radius:3px;padding:6px 10px;background:var(--bg2)}.chips2{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hwrap{overflow:auto;min-height:0;flex:1;border:1px solid var(--bd);border-radius:3px;overscroll-behavior:contain}
.ht{margin:0}.ht th{position:sticky;top:0;background:var(--bg2);z-index:2}.ht td small{display:block;color:var(--mu);font-size:10.5px}
.ht td{vertical-align:top;border-bottom:1px solid var(--bd);padding:4px 8px}
.ht th:first-child,.ht td:first-child{position:sticky;left:0;background:var(--pn);z-index:1;text-align:left;color:var(--tx)}.ht th:first-child{z-index:3;background:var(--bg2)}
.ht td:nth-child(2),.ht td:nth-child(3),.ht td:nth-child(4),.ht th:nth-child(2),.ht th:nth-child(3),.ht th:nth-child(4),.ht td.nkc{text-align:left}
.ht tr.live td{background:#101c2a}.ht tr.live td:first-child{background:#101c2a}

/* ---------- responsif */
@media(max-width:1049px){
  .br{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bn,.bo{grid-column:1/-1}
}
@media(max-width:620px){
  body{font-size:12px}
  .top{padding:6px 10px;gap:2px 12px}.page{padding:8px 8px 40px;gap:10px}
  .brand{display:none}#px{font-size:22px}.meta{font-size:11px;gap:2px 10px}#st{display:none}
  .vrow{grid-template-columns:1fr}.vcell{flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px 10px}.vl{min-width:78px}
  .br{grid-template-columns:1fr;gap:4px;padding:8px 10px}
  .vd{font-size:11px;padding:1px 7px;white-space:normal}.vcell{padding:6px 10px}.vl{min-width:70px}
  .k{display:inline;margin-right:8px}.eb{min-width:40px}
  .hnote{display:none}.sb{padding:5px 8px}.ph small{display:none}
  .ctl button{padding:5px 9px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:0;margin:0}
  #hdlg{width:100vw;max-height:100dvh}
  textarea{height:52dvh}
}

/* ---------- DESKTOP: satu halaman yang menggulir; level map menempel di kanan */
@media(min-width:1050px){
  body{font-size:12px}
  #app.page{display:grid;gap:12px;align-items:start;grid-template-columns:minmax(0,1fr) 340px;max-width:1900px;margin:0 auto}
  .s-bias{grid-column:1;grid-row:1}
  .s-prof{grid-column:1;grid-row:2;grid-template-columns:repeat(2,minmax(0,1fr))}
  .s-lvl{grid-column:2;grid-row:1/3;position:sticky;top:58px;align-self:start;max-height:calc(100dvh - 72px);display:flex;flex-direction:column}
  .s-lvl .ladwrap{max-height:none;flex:1;min-height:0}
  .br{grid-template-columns:minmax(290px,370px) minmax(0,1fr) minmax(0,1fr);gap:2px 14px;padding:6px 12px}
  .bn{grid-column:1;grid-row:1}.bo{grid-column:1;grid-row:2}.bc.c{grid-column:2;grid-row:1/3}.bc.l{grid-column:3;grid-row:1/3}
  .vcell{padding:6px 12px;gap:3px}.vd{max-width:100%}
}
@media(min-width:1750px){.s-prof{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* teks selalu bisa diblok untuk copy-paste */
body{-webkit-user-select:text;user-select:text}button{-webkit-user-select:none;user-select:none}
#age{font-size:11px;margin-left:2px}
.embed .brand{display:none}.embed .top{padding:4px 10px}
</style>
</head>
<body>
<header class="hd">
  <div class="top">
    <span class="brand">TPO<i>//</i>CTX</span>
    <span class="tick"><span id="sym">–</span><span id="px">–</span><span id="age" title="Umur tick terakhir yang diterima engine dari sumber data (hijau = baru)"></span></span>
    <span class="meta"><span id="atr"></span><span id="asof"></span></span>
    <span class="ctl"><span id="dot"></span><span id="st">menghubungkan…</span><button id="btg" title="Notifikasi Telegram">Telegram</button><button id="bcfg" title="Pengaturan engine">Config</button></span>
  </div>
</header>
<div id="banner"></div>
<main id="app" class="page"></main>

<dialog id="dlg">
  <div class="dh"><b>CONFIG.JSON</b><span class="mu">parameter engine</span></div>
  <textarea id="ta" spellcheck="false"></textarea>
  <div id="err"></div>
  <div class="row" style="justify-content:flex-end"><button id="bx">Tutup</button><button id="bs" class="pri">Simpan</button></div>
</dialog>

<dialog id="tgdlg">
  <div class="dh"><b>TELEGRAM</b><button id="tgx">Tutup</button></div>
  <div id="tgst" class="kv"></div>
  <div class="row"><button id="tgsend" class="pri">Kirim bias + level sekarang</button><button id="tgtest">Test koneksi</button></div>
  <div id="tgmsg"></div>
  <div class="mu" style="margin:8px 0 4px">Pengaturan notifikasi (tanpa token / chat id; keduanya hanya di file <b>telegram.json</b> atau env)</div>
  <textarea id="tgta" spellcheck="false" style="height:34vh"></textarea>
  <div class="row" style="justify-content:flex-end"><button id="tgsave">Simpan pengaturan</button></div>
</dialog>

<dialog id="hdlg"><div id="hbody"></div></dialog>
<script type="module" src="/client.js"></script>
</body>
</html>

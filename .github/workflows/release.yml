name: release

# Rilis: push tag, mis.  git tag v0.2.0 && git push origin v0.2.0
# Tanpa tag (tombol "Run workflow"): hanya membangun dan menyimpan artifact, tidak membuat Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Klien web dibangun sekali dari sumber TS, lalu dipakai semua job (ditanam ke biner lewat rust-embed).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build klien web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  test:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tes
        run: cargo test --release --workspace --locked
      - name: Tipe TS dari Rust (ts-rs) harus sinkron dengan yang ter-commit
        run: git diff --exit-code -- web/src/gen

  build:
    needs: [web, test]
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux statis (musl): jalan di distro apa pun, tanpa dependensi libc
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          # Android / Termux (ARM64). Memakai libc Android (bionic), bukan musl, supaya DNS jalan di Termux.
          - { target: aarch64-linux-android,      os: ubuntu-latest,    android: true }
          # Windows (CRT statis, tanpa perlu Visual C++ Redistributable)
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   ext: ".exe", rustflags: "-C target-feature=+crt-static" }
          # macOS Apple Silicon dan Intel (keduanya dibangun di runner Apple Silicon)
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Toolchain musl
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          T=$(echo "${{ matrix.target }}" | tr '-' '_')
          echo "CC_${T}=musl-gcc" >> "$GITHUB_ENV"

      - name: Toolchain Android NDK
        if: matrix.android
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --bin mcdash --target ${{ matrix.target }}

      - name: Siapkan berkas rilis
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/mcdash${{ matrix.ext }}" "out/mcdash-${{ matrix.target }}${{ matrix.ext }}"
          cd out
          if command -v sha256sum >/dev/null; then sha256sum mcdash-* > "mcdash-${{ matrix.target }}.sha256"
          else shasum -a 256 mcdash-* > "mcdash-${{ matrix.target }}.sha256"; fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Gabungkan checksum
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
